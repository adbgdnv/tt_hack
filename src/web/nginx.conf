# Конфиг nginx внутри контейнера cc-web.
#
# Контейнер отдаёт собранный SPA. На сервере перед ним стоит nginx хоста: он держит
# TLS и basic-авторизацию и проксирует сюда всё, кроме /api/ и /__review__/.
# Локально контейнер самодостаточен — /api/ он проксирует в соседний контейнер api.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;

    # SPA: маршруты рисует React, поэтому неизвестный путь отдаёт index.html, а не 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хэшированные вите-ассеты неизменяемы: имя меняется вместе с содержимым.
    # Оверлей ревью (/assets/vibe-debug.js) сюда не попадает — на сервере его
    # перехватывает nginx хоста, локально его нет и 404 безвреден (см. index.html).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе браузер продолжит просить ассеты прошлой сборки.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API → контейнер api той же compose-сети. Нужен только локальному запуску:
    # на сервере /api/ до контейнера не доходит, его забирает nginx хоста.
    #
    # Адрес через переменную и явный resolver — намеренно. С литеральным
    # `proxy_pass http://api:8000/` nginx резолвит имя один раз при старте, и если
    # контейнер api в этот момент лежит, web не поднимается вовсе. С переменной имя
    # резолвится на каждом запросе: упавший бэкенд даёт 502 на /api/, а не мёртвый фронт.
    # 127.0.0.11 — DNS docker внутри compose-сети.
    #
    # rewrite обязателен: у proxy_pass с переменной нет автоматического среза
    # префикса, поэтому /api/counterparties/123 руками превращаем в /counterparties/123.
    location ^~ /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
