name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Проверить стиль
        run: ruff check .

      - name: Прогнать тесты
        # выгрузка кейсодателя лежит вне репозитория, поэтому тесты,
        # которым нужны данные, помечены и здесь пропускаются
        run: pytest -q
