name: Deploy preview

# Слушает завершение CI на main. Публикует превью только если CI зелёный (FR-003).
# Ручной запуск — workflow_dispatch (обходит гард на conclusion).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Одновременно выкладывается не более одной версии (FR-013). Текущую не рвём.
concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # для workflow_run — тот же коммит, что прошёл CI; для dispatch — main
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Настроить SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Прокинуть окружение бэкенда
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
        run: |
          if [ -z "${LLM_API_KEY}" ]; then
            echo "LLM_API_KEY не задан — пропускаю"; exit 0
          fi
          # Ключ уходит через stdin, а не аргументом: аргументы видны в ps на сервере.
          # umask 077 — файл создаётся сразу с правами 600.
          # Трассировка включается только когда ключ задан: пустой LANGSMITH_TRACING
          # оставляет её выключенной, и сервис работает как прежде.
          TRACING_LINES=""
          if [ -n "${LANGSMITH_API_KEY}" ]; then
            TRACING_LINES="LANGSMITH_TRACING=true"
          fi
          printf '%s\n' \
            '# Создаётся деплоем (.github/workflows/deploy.yml). Правки руками затрутся.' \
            'API_ROOT_PATH=/api' \
            "LLM_PROVIDER=${LLM_PROVIDER:-groq}" \
            "LLM_API_KEY=${LLM_API_KEY}" \
            "${TRACING_LINES}" \
            "LANGSMITH_API_KEY=${LANGSMITH_API_KEY}" \
            "LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-counterparty-checker}" \
          | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'umask 077 && cat > /opt/tt-hack/.env'
          echo "окружение записано в /opt/tt-hack/.env"
          # Контейнер подхватит его при следующем `docker compose up -d api`:
          # бэкенд обновляется вручную, автодеплой его намеренно не рестартует.

      - name: Выкатить бэкенд
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Бэкенд идёт ПЕРЕД фронтом намеренно. Новый бэкенд шлёт поля, которых
          # старый фронт не знает, — тот их просто игнорирует. Обратный порядок
          # ронял страницу в белый экран: фронт ждал поле, которого сервер ещё
          # не отдавал.
          #
          # Скрипт на сервере принадлежит root и лежит вне git-клона; sudo выдан
          # ровно на него одной строкой в /etc/sudoers.d/tt-hack-api.
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo /usr/local/bin/tt-hack-api-deploy'

      - name: Выкатить фронтенд
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Фронт собирается контейнером на сервере, а не здесь: образ и есть
          # артефакт выкладки. Раннер больше не запускает npm — сборка и запуск
          # в одном месте, и на сервер не приезжает собранная где-то ещё статика.
          #
          # Сломанная сборка сюда не доедет: скрипт собирает образ до подмены
          # контейнера, а не поднявшийся фронт откатывает на предыдущий образ.
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo /usr/local/bin/tt-hack-web-deploy'

      - name: Выложить статику превью
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        # --no-web: сборку фронта забрал шаг выше. Здесь остаётся оверлей ревью
        # из preview/ — nginx отдаёт его мимо контейнера, и smoke-check по /,
        # который проверяет уже опубликованный фронт из образа.
        run: scripts/preview_deploy.sh --no-web

      - name: Итог
        if: always()
        run: |
          {
            echo "### Deploy preview"
            echo ""
            echo "- Коммит: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Фронтенд: образ cc-web собран и запущен на сервере"
            echo "- Результат job: ${{ job.status }}"
            echo ""
            echo "Логи шага «Выложить статику превью» содержат коды smoke-check по каждой странице."
          } >> "$GITHUB_STEP_SUMMARY"
