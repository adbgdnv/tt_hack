name: Deploy preview

# Слушает завершение CI на main. Публикует превью только если CI зелёный (FR-003).
# Ручной запуск — workflow_dispatch (обходит гард на conclusion).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Одновременно выкладывается не более одной версии (FR-013). Текущую не рвём.
concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # для workflow_run — тот же коммит, что прошёл CI; для dispatch — main
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Есть ли фронтенд для сборки
        id: web
        run: |
          if [ -f src/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version: lts/*
          # кэш npm включим, когда в src/web появится package-lock.json
          # (сейчас его нет — cache-dependency-path уронил бы шаг)

      - name: Настроить SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Выложить превью
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: scripts/preview_deploy.sh

      - name: Прокинуть окружение бэкенда
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "${LLM_API_KEY}" ]; then
            echo "LLM_API_KEY не задан — пропускаю"; exit 0
          fi
          # Ключ уходит через stdin, а не аргументом: аргументы видны в ps на сервере.
          # umask 077 — файл создаётся сразу с правами 600.
          printf '%s\n' \
            '# Создаётся деплоем (.github/workflows/deploy.yml). Правки руками затрутся.' \
            'API_ROOT_PATH=/api' \
            "LLM_PROVIDER=${LLM_PROVIDER:-groq}" \
            "LLM_API_KEY=${LLM_API_KEY}" \
          | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'umask 077 && cat > /opt/tt-hack/.env'
          echo "окружение записано в /opt/tt-hack/.env"
          # Контейнер подхватит его при следующем `docker compose up -d api`:
          # бэкенд обновляется вручную, автодеплой его намеренно не рестартует.

      - name: Итог
        if: always()
        run: |
          {
            echo "### Deploy preview"
            echo ""
            echo "- Коммит: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Фронтенд: ${{ steps.web.outputs.present == 'true' && 'сборка' || 'пропуск (нет package.json)' }}"
            echo "- Результат job: ${{ job.status }}"
            echo ""
            echo "Логи шага «Выложить превью» содержат коды smoke-check по каждой странице."
          } >> "$GITHUB_STEP_SUMMARY"
