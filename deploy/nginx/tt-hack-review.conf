# /etc/nginx/sites-available/tt-hack-review  → symlink в sites-enabled/
#
# Общий превью-сервер vibe-debug за Basic Auth.
# Домен — sslip.io (wildcard DNS на IP сервера, домен не покупается):
#   tt-hack-review.<IP-через-точки>.sslip.io
# certbot --nginx сам добавит 443-блок и редирект с 80.
#
# Пароли (htpasswd) живут только на сервере, в репозиторий не коммитятся.

server {
    listen 80;
    listen [::]:80;
    server_name tt-hack-review.72.56.16.44.sslip.io;

    auth_basic "tt_hack review";
    auth_basic_user_file /etc/nginx/htpasswd/tt-hack;

    # Оверлей коммент-ревью. Единственное, что осталось от статической выкладки:
    # он живёт в git-tracked preview/, обновляется автодеплоем (scripts/preview_deploy.sh)
    # через симлинк /opt/tt-hack-preview/current и не требует пересборки образа фронта.
    # Блок стоит ВЫШЕ location / и с ^~ — иначе запрос ушёл бы в контейнер, где
    # этого файла нет.
    location ^~ /assets/vibe-debug {
        root /opt/tt-hack-preview/current;
        try_files $uri =404;
    }

    # Фронтенд → контейнер cc-web, слушающий только localhost.
    # Раньше здесь была статика из релиза; теперь собранный SPA живёт в образе,
    # и выкатывает его /usr/local/bin/tt-hack-web-deploy.
    #
    # Слэша в конце proxy_pass здесь быть не должно: путь уходит в контейнер как
    # есть, там его разбирает nginx образа (SPA-фолбэк на index.html).
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # API контрагентов → контейнер cc-api, слушающий только localhost.
    #
    # Слэш в конце proxy_pass обязателен: он срезает префикс, и /api/counterparties/123
    # уходит в сервис как /counterparties/123.
    #
    # Фронт ходит сюда относительным путём (VITE_API_BASE=/api), поэтому запрос идёт
    # на тот же origin: CORS не нужен, а basic-авторизация действует и на API — блок
    # наследует auth_basic от server, объявлять её отдельно не надо.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Review API → локальный vibe_debug_server.py.
    location ^~ /__review__/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Review-User $remote_user;   # автор комментария = логин Basic Auth
        proxy_read_timeout 15s;
        client_max_body_size 12m;
    }
}
