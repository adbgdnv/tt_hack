# Вставляется в server-блок домена превью.
# Всё превью — за Basic Auth; пароли (htpasswd) живут только на сервере.

auth_basic "tt_hack review";
auth_basic_user_file /etc/nginx/htpasswd/tt-hack;

# Статика превью (index.html + assets + собранный фронтенд, когда появится).
location / {
    root /opt/tt-hack/preview;
    try_files $uri $uri/ =404;
}

# Review API — на локальный сервер vibe_debug_server.py.
location ^~ /__review__/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Review-User $remote_user;   # автор комментария = логин Basic Auth
    proxy_read_timeout 15s;
    client_max_body_size 12m;
}
