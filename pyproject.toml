[project]
name = "counterparty-checker"
version = "0.1.0"
description = "ИИ-агент проверки контрагентов — хакатон «Альфа Будущее»"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "mcp>=1.2",
    "langchain-openai>=1.6",
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-mcp-adapters>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Устанавливается только ядро. src/api и src/mcp_server — точки входа: они
# импортируют core, но обратная зависимость физически не соберётся.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." — чтобы tests/test_vibe_debug_server.py видел пакет scripts/
pythonpath = ["src", "."]
# Поток ответа асинхронный, значит и его тесты тоже. "auto" — чтобы не помечать
# каждый async-тест вручную: помеченным должен быть отход от правила, а не правило.
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["temp", "preview", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
