# Локальный запуск и деплой на Timeweb — один и тот же файл.
# Kubernetes сознательно не берём: базы нет, модель внешняя, демонстрация локальная.

services:
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: cc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # выгрузка кейсодателя лежит вне репозитория и в образ не попадает
      - ./data:/app/docs_alpha:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: .
      dockerfile: src/mcp_server/Dockerfile
    container_name: cc-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./data:/app/docs_alpha:ro

