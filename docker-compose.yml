# Локальный запуск и деплой на Timeweb — один и тот же файл.
# Kubernetes сознательно не берём: базы нет, модель внешняя, демонстрация локальная.
#
# Образы приезжают из реестра, собранные в раннере. Раздел `build` оставлен
# для локального запуска: `docker compose up --build` соберёт на месте, как и раньше.
# На сервере подъём идёт с `--no-build` — иначе compose при отсутствии образа
# решит собрать его сам, и всё вернётся к тому, из-за чего эта правка и появилась:
# сборка на машине с 894 МБ памяти клала сервис на пятнадцать минут.
#
# TAG — метка коммита. Локально его нет, поэтому запасной вариант `latest`.

services:
  api:
    image: ghcr.io/adbgdnv/tt_hack/api:${TAG:-latest}
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: cc-api
    restart: unless-stopped
    ports:
      # только localhost: наружу сервис отдаёт nginx, и делает это за basic-авторизацией.
      # Публиковать порт на все интерфейсы нельзя — в данных ФИО и личные ИНН учредителей.
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATASET_PATH: /app/dataset/counterparties.json
      # Пусто локально, "/api" на сервере — задаётся в .env рядом с compose-файлом.
      API_ROOT_PATH: ${API_ROOT_PATH:-}
    volumes:
      # Подготовленный набор, а не исходная выгрузка: сервис читает результат сборки.
      # В образ не копируется и в репозиторий не попадает — только том.
      - ./dataset:/app/dataset:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: .
      dockerfile: src/mcp_server/Dockerfile
    container_name: cc-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      DATASET_PATH: /app/dataset/counterparties.json
    volumes:
      - ./dataset:/app/dataset:ro

  web:
    build:
      # Контекст — сам каталог фронтенда, а не корень: в образ не должно попадать
      # ничего из data/ и dataset/, а сборке нужны только исходники src/web.
      context: ./src/web
      dockerfile: Dockerfile
      args:
        # Относительный путь, а не адрес сервера: запрос идёт на тот же origin,
        # поэтому не нужен CORS и действует та же basic-авторизация. На сервере
        # /api/ забирает nginx хоста, локально — nginx внутри контейнера.
        VITE_API_BASE: /api
    image: ghcr.io/adbgdnv/tt_hack/web:${TAG:-latest}
    container_name: cc-web
    restart: unless-stopped
    ports:
      # Тоже только localhost: наружу фронт отдаёт nginx сервера, и делает это
      # за basic-авторизацией. На сервере ufw выключен — всё, что забиндится
      # на 0.0.0.0, немедленно доступно из интернета, а за /api/ лежат ФИО
      # и личные ИНН учредителей.
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Адрес именно 127.0.0.1, не localhost. В образе localhost резолвится
      # только в ::1, а nginx слушает IPv4 — проверка отвечала «connection
      # refused» на исправном контейнере, помечала его нездоровым и валила
      # выкатку, хотя страница отдавалась.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
