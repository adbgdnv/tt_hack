# Локальный запуск и деплой на Timeweb — один и тот же файл.
# Kubernetes сознательно не берём: базы нет, модель внешняя, демонстрация локальная.

services:
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: cc-api
    restart: unless-stopped
    ports:
      # только localhost: наружу сервис отдаёт nginx, и делает это за basic-авторизацией.
      # Публиковать порт на все интерфейсы нельзя — в данных ФИО и личные ИНН учредителей.
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATASET_PATH: /app/dataset/counterparties.json
      # Пусто локально, "/api" на сервере — задаётся в .env рядом с compose-файлом.
      API_ROOT_PATH: ${API_ROOT_PATH:-}
    volumes:
      # Подготовленный набор, а не исходная выгрузка: сервис читает результат сборки.
      # В образ не копируется и в репозиторий не попадает — только том.
      - ./dataset:/app/dataset:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: .
      dockerfile: src/mcp_server/Dockerfile
    container_name: cc-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      DATASET_PATH: /app/dataset/counterparties.json
    volumes:
      - ./dataset:/app/dataset:ro

  # Раскомментировать, когда появится фронт (src/web).
